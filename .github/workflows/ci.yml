name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge gate: format, lint, typecheck, build, and test the whole monorepo.
  check:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: proctoring
          POSTGRES_PASSWORD: proctoring
          POSTGRES_DB: proctoring_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proctoring -d proctoring_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # pnpm must be set up before setup-node so its cache can resolve the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # core-api's test global-setup migrates `proctoring_test` but does not
      # create it; violation-ingest creates its own DB. Mirror the local
      # initdb (infra/local/postgres/initdb) so the service tests can connect.
      - name: Create test database
        env:
          PGPASSWORD: proctoring
        run: |
          psql -h localhost -U proctoring -d proctoring_dev \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'proctoring_test'" \
            | grep -q 1 \
          || psql -h localhost -U proctoring -d proctoring_dev \
            -c "CREATE DATABASE proctoring_test"

      # NOTE: `pnpm format:check` (Prettier) is intentionally not a gate yet —
      # the repo predates the formatter and isn't normalised, so it would fail
      # on day one. Enabling it needs a one-off `pnpm format` pass; tracked as a
      # follow-up (see docs/runbooks/ci-cd.md). ESLint runs below in the meantime.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Validate the Terraform under infra/ without touching any cloud or state.
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate stacks
        run: |
          set -euo pipefail
          for dir in \
            infra/bootstrap \
            infra/environments/dev \
            infra/environments/staging \
            infra/environments/production; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Prove the service images build (no push — registry/deploy land with PRO-38).
  docker:
    name: Build service images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [core-api, violation-ingest]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: proctoring/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
